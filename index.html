
!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Futuro</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101827;color:white;padding:20px}
header{text-align:center;padding:25px 0}
header h1{color:#42e8a3;margin-bottom:8px}
header p{color:#b9c5d6}
.card{background:#1d293b;padding:18px;border-radius:15px;margin:15px 0}
label{display:block;margin:12px 0 6px;color:#b9c5d6}
input{width:100%;padding:13px;border-radius:8px;border:1px solid #44516a;background:#101827;color:white;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:8px;background:#42e8a3;color:#102018;font-weight:bold;font-size:16px;margin-top:16px}
.valor{font-size:27px;color:#42e8a3;font-weight:bold}
small{color:#b9c5d6}
</style>
</head>
<body>
<header>
<h1>MEU FUTURO</h1>
<p>Disciplina hoje, liberdade amanhã.</p>
</header>
<div class="card">
<h3>Minha meta financeira</h3>
<label>Meta mensal (R$)</label>
<input id="meta" type="number" value="3000">
<label>Quanto ganhei hoje (R$)</label>
<input id="ganho" type="number" placeholder="Digite seu ganho">
<label>Gastos de hoje (R$)</label>
<input id="gastos" type="number" value="40">
<button onclick="registrar()">Registrar meu dia</button>
</div>
<div class="card">
<h3>Saldo de hoje</h3>
<div class="valor" id="saldo">R$ 0,00</div>
<small>Ganhos menos gastos registrados.</small>
</div>
<div class="card">
<h3>Meu progresso</h3>
<div class="valor" id="progresso">0%</div>
<p id="resumo">Registre seu primeiro dia!</p>
</div>
<script>
let total=0;
function moeda(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function registrar(){
let ganho=Number(document.getElementById('ganho').value)||0;
let gastos=Number(document.getElementById('gastos').value)||0;
let meta=Number(document.getElementById('meta').value)||3000;
let saldo=ganho-gastos;
total+=saldo;
document.getElementById('saldo').textContent=moeda(saldo);
let percentual=Math.max(0,total/meta*100);
document.getElementById('progresso').textContent=percentual.toFixed(1)+'%';
document.getElementById('resumo').textContent='Acumulado nesta sessão: '+moeda(total)+' de '+moeda(meta)+'.';
}
</script>
</body>
</html>
